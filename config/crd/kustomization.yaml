# This kustomization.yaml is not intended to be run by itself,
# since it depends on service name and namespace that are out of this kustomize package.
# It should be run by config/default
resources:
- bases/pipelines.kubeflow.org_pipelines.yaml
- bases/pipelines.kubeflow.org_runs.yaml
- bases/pipelines.kubeflow.org_runconfigurations.yaml
- bases/pipelines.kubeflow.org_runschedules.yaml
- bases/pipelines.kubeflow.org_experiments.yaml
- bases/pipelines.kubeflow.org_providers.yaml
#+kubebuilder:scaffold:crdkustomizeresource

patches:
# [WEBHOOK] To enable webhook, uncomment all the sections with [WEBHOOK] prefix.
# patches here are for enabling the conversion webhook for each CRD
- path: patches/webhook_in_pipelines.yaml
- path: patches/webhook_in_runs.yaml
- path: patches/webhook_in_runconfigurations.yaml
- path: patches/webhook_in_runschedules.yaml
- path: patches/webhook_in_experiments.yaml
- path: patches/webhook_in_providers.yaml
#+kubebuilder:scaffold:crdkustomizewebhookpatch

# [CERTMANAGER] CA injection for each CRD is handled by the 'replacements' in
# config/default/kustomization.yaml, which populate the cert-manager.io/inject-ca-from
# annotation on every CustomResourceDefinition.
#+kubebuilder:scaffold:crdkustomizecainjectionpatch

# the following config is for teaching kustomize how to do kustomization for CRDs.
configurations:
- kustomizeconfig.yaml
