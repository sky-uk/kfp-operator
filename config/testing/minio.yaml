apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: argo
  labels:
    app: minio
spec:
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      automountServiceAccountToken: false
      volumes:
        - name: data
          emptyDir: {}
      containers:
        - name: main
          image: docker.io/bitnamilegacy/minio:2025.5.24-debian-12-r5
          command:
            - minio
            - server
            - --console-address
            - :9001
            - /data
          env:
            - name: MINIO_ACCESS_KEY
              value: admin
            - name: MINIO_SECRET_KEY
              value: password
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: dashboard
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
